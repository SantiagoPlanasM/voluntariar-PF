# render.yaml — configuración automática para Render
# Render lee este archivo y crea los servicios automáticamente

services:
  # ── Backend (API) ────────────────────────────────────────────────────────
  - type: web
    name: voluntariar-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: voluntariar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://voluntariar.onrender.com
    healthCheckPath: /health

  # ── Frontend (Static Site) ───────────────────────────────────────────────
  - type: web
    name: voluntariar
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://voluntariar-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Base de datos PostgreSQL ─────────────────────────────────────────────
databases:
  - name: voluntariar-db
    databaseName: voluntariar
    plan: free
