# render.yaml — configuración automática para Render
# Render lee este archivo y crea los servicios automáticamente.
# Todo en plan gratuito: sin `plan: free`, un servicio web usa el plan pago por defecto y Render pide tarjeta.

services:
  # ── Backend (API) ────────────────────────────────────────────────────────
  - type: web
    name: voluntariar-api
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm run db:migrate && npm start
    envVars:
      # El backend exige Node >= 22 (package.json, "engines").
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: voluntariar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Si Render asigna otra URL al frontend (el nombre ya estaba tomado), corregir esta y APP_URL.
      - key: CORS_ORIGINS
        value: https://voluntariar.onrender.com
      # Links de los emails (sin esto apuntan a http://localhost:5173)
      - key: APP_URL
        value: https://voluntariar.onrender.com
      # Emails (Resend). Sin RESEND_API_KEY los emails se omiten.
      # Con el remitente de pruebas solo se entrega al email registrado en Resend:
      # para pruebas, agregá EMAIL_REDIRECT_TO en el panel (ver backend/.env.example).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: VoluntariAR <onboarding@resend.dev>
      # Fotos de Momentos (Cloudinary). Hacen falta las tres; sin ellas publicar responde 503.
      # Los valores secretos se cargan en el panel de Render, nunca en este archivo.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    healthCheckPath: /health

  # ── Frontend (Static Site, gratis) ───────────────────────────────────────
  - type: web
    name: voluntariar
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Si Render asigna otra URL a la API, corregir esta.
      - key: VITE_API_URL
        value: https://voluntariar-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Base de datos PostgreSQL ─────────────────────────────────────────────
databases:
  - name: voluntariar-db
    databaseName: voluntariar
    plan: free
