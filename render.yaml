# render.yaml — configuración automática para Render
# Render lee este archivo y crea los servicios automáticamente.
# Todo en plan gratuito: sin `plan: free`, un servicio web usa el plan pago por defecto y Render pide tarjeta.

services:
  # ── Backend (API) ────────────────────────────────────────────────────────
  - type: web
    name: voluntariar-api
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm run db:migrate && npm start
    envVars:
      # El backend exige Node >= 22 (package.json, "engines").
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: voluntariar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Si Render asigna otra URL al frontend (el nombre ya estaba tomado), corregir esta y APP_URL.
      - key: CORS_ORIGINS
        value: https://voluntariar-g0u6.onrender.com
      # Links de los emails (sin esto apuntan a http://localhost:5173)
      - key: APP_URL
        value: https://voluntariar-g0u6.onrender.com
      # Emails (Resend). Sin RESEND_API_KEY los emails se omiten.
      # Con el remitente de pruebas solo se entrega al email registrado en Resend:
      # para pruebas, agregá EMAIL_REDIRECT_TO en el panel (ver backend/.env.example).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: VoluntariAR <onboarding@resend.dev>
      # Fotos de Momentos (Cloudinary). Hacen falta las tres; sin ellas publicar responde 503.
      # Los valores secretos se cargan en el panel de Render, nunca en este archivo.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Donaciones (Mercado Pago, modo prueba; PROJECT_ANALYSIS.md §170–§173, Marketplace §215–§218).
      # Cada donación se cobra con la cuenta de la ONG: sin MP_TOKEN_KEY (la clave que cifra sus tokens) nadie puede
      # donar. MP_ACCESS_TOKEN (la cuenta de la aplicación) solo concilia las donaciones de antes de §217. Sin
      # MP_WEBHOOK_SECRET no se acepta ningún aviso (la donación igual se confirma cuando el comprador vuelve).
      # Los valores secretos se cargan en el panel de Render, nunca en este archivo.
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_TOKEN_KEY
        sync: false
      # OAuth para que la ONG vincule su cuenta (sin las tres, el perfil dice que la vinculación no está disponible y
      # queda la carga manual, scripts/vincular-mp-manual.js). La URL tiene que coincidir EXACTAMENTE con la de la
      # aplicación en Mercado Pago; no es secreta.
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_OAUTH_REDIRECT_URI
        value: https://voluntariar-g0u6.onrender.com/ngo/mercadopago/vuelta
    healthCheckPath: /health

  # ── Frontend (Static Site, gratis) ───────────────────────────────────────
  - type: web
    name: voluntariar
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Si Render asigna otra URL a la API, corregir esta.
      - key: VITE_API_URL
        value: https://voluntariar-api-lxq7.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Base de datos PostgreSQL ─────────────────────────────────────────────
databases:
  - name: voluntariar-db
    databaseName: voluntariar
    plan: free
