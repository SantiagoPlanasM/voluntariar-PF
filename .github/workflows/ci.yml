# .github/workflows/ci.yml — integración continua de VoluntariAR (TP de Calidad, docs/PLAN_CALIDAD_TP.md T3).
# Corre las pruebas del backend (SQLite y Postgres 16, en UTC y en la zona de Córdoba) con cobertura del runner
# de Node, las del frontend con tipos y build, y npm audit. Publica los reportes. No despliega (eso es deploy.yml, T9).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'   # la misma que Render (render.yaml: NODE_VERSION "22")
# runs-on fijo en ubuntu-24.04: ubuntu-latest pasa a Ubuntu 26 desde el 2026-10-19 y no queremos que el runner
# cambie justo antes de la entrega del TP (§186).

jobs:
  backend-sqlite:
    name: Backend · SQLite · ${{ matrix.tz }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/Argentina/Cordoba]
    defaults:
      run:
        working-directory: backend
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci            # respeta backend/.npmrc (ignore-scripts): better-sqlite3 usa su prebuild linux-x64
      - run: mkdir -p reports
      # include explícito: sin él, el run #2 (Node 22) informó 96,51 % de líneas contra 92,9 % en Node 24 local,
      # con otra lista de archivos (§187). Así se mide solo el código productivo en cualquier versión de Node.
      - name: Tests + cobertura (umbral 80 % en líneas, ramas y funciones)
        run: >
          node --test --experimental-test-coverage
          --test-coverage-include='src/**' --test-coverage-include='scripts/**'
          --test-coverage-lines=80 --test-coverage-branches=80 --test-coverage-functions=80
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=tap  --test-reporter-destination=reports/tap.txt
          --test-reporter=lcov --test-reporter-destination=reports/lcov.info
      - name: Resumen en la página del run
        if: always()
        run: |
          {
            echo "### Backend · SQLite · $TZ"
            echo '```'
            grep -E '^# (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms) ' reports/tap.txt || echo 'sin reporte TAP'
            echo '```'
            echo '<details><summary>Cobertura</summary>'
            echo
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' reports/tap.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-sqlite-${{ strategy.job-index }}
          path: backend/reports/

  backend-postgres:
    name: Backend · Postgres 16 · ${{ matrix.tz }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/Argentina/Cordoba]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust     # igual que el docker run de CLAUDE.md
          POSTGRES_DB: voluntariar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TZ: ${{ matrix.tz }}
      TEST_PG_HOST: localhost
      TEST_PG_PORT: '5432'
      TEST_PG_DB: voluntariar_test
      TEST_PG_USER: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: mkdir -p reports
      - name: Tests contra Postgres
        run: >
          npm run test:pg --
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=tap  --test-reporter-destination=reports/tap.txt
      - name: Resumen en la página del run
        if: always()
        run: |
          {
            echo "### Backend · Postgres 16 · $TZ"
            echo '```'
            grep -E '^# (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms) ' reports/tap.txt || echo 'sin reporte TAP'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-postgres-${{ strategy.job-index }}
          path: backend/reports/

  frontend-tests:
    name: Frontend · tests · ${{ matrix.tz }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/Argentina/Cordoba]
    defaults:
      run:
        working-directory: frontend
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests + cobertura (vitest, v8; umbral de 80 % en líneas, en vite.config.ts)
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      - name: Resumen en la página del run
        if: always()
        run: |
          {
            echo "### Frontend · $TZ"
            echo '```'
            grep -m1 -o '<testsuites[^>]*>' reports/junit.xml || echo 'sin reporte junit'
            echo '```'
            echo '```'
            node -e "const t=require('./reports/coverage/coverage-summary.json').total; for (const k of ['lines','statements','branches','functions']) console.log(k.padEnd(11), t[k].pct + '%', t[k].covered + '/' + t[k].total)" || echo 'sin reporte de cobertura'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-tests-${{ strategy.job-index }}
          path: frontend/reports/

  frontend-build:
    name: Frontend · tipos y build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck      # TypeScript 7 del package.json (nunca npx tsc)
      - run: npm run build
        env:
          VITE_API_URL: https://voluntariar-api-lxq7.onrender.com/api   # el mismo valor que render.yaml

  audit:
    name: npm audit (backend y frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Backend
        run: npm audit
        working-directory: backend
      - name: Frontend
        if: always()
        run: npm audit
        working-directory: frontend

  # SonarCloud (la herramienta nueva del TP, D5) + el quality gate del TP. El plan gratis solo tiene el gate
  # "Sonar way": los umbrales del TP los evalúa .github/scripts/sonar-gate.js con las métricas del análisis.
  sonar:
    name: SonarCloud + quality gate del TP
    needs: [backend-sqlite, frontend-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Falta SONAR_TOKEN → el gate no aprueba sin medir
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::error::Falta el secreto SONAR_TOKEN: sin análisis no hay gate, y el gate no aprueba sin medir"
          exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # Sonar usa la historia para "código nuevo" y para atribuir líneas
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Tests del script del gate
        run: node --test ".github/scripts/*.test.js"   # una carpeta suelta no sirve: la toma como archivo (run #4, §189)
      - name: Cobertura del backend (job SQLite · UTC)
        uses: actions/download-artifact@v8
        with:
          name: backend-sqlite-0
          path: coverage/backend
      - name: Cobertura del frontend (job tests · UTC)
        uses: actions/download-artifact@v8
        with:
          name: frontend-tests-0
          path: coverage/frontend
      - name: Rutas del lcov relativas a la raíz del repo
        run: |
          sed -i 's#^SF:#SF:backend/#' coverage/backend/lcov.info
          sed -i 's#^SF:#SF:frontend/#' coverage/frontend/coverage/lcov.info
          grep -m1 '^SF:' coverage/backend/lcov.info
          grep -m1 '^SF:' coverage/frontend/coverage/lcov.info
      - name: Análisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
      - name: Quality gate del TP (bugs y vulnerabilidades críticas, duplicación > 5 %, cobertura de código nuevo < 80 %)
        run: node .github/scripts/sonar-gate.js
