# sonar-project.properties — análisis de SonarCloud (TP de Calidad, D5; docs/PLAN_CALIDAD_TP.md).
# Lo lee SonarSource/sonarqube-scan-action en el job "sonar" de .github/workflows/ci.yml.
sonar.organization=santiagoplanasm-1
sonar.projectKey=SantiagoPlanasM_voluntariar-PF
sonar.sourceEncoding=UTF-8

# Código productivo: el mismo que mide la cobertura (backend: src/ y scripts/; frontend: src/ sin tests).
sonar.sources=backend/src,backend/scripts,frontend/src
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Tests (Sonar los reconoce como tales y no los cuenta como código a cubrir ni en la duplicación).
sonar.tests=backend/test,frontend/src
sonar.test.inclusions=backend/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Cobertura: los lcov que generan los jobs de tests (UTC), con las rutas ya prefijadas con backend/ o frontend/.
sonar.javascript.lcov.reportPaths=coverage/backend/lcov.info,coverage/frontend/coverage/lcov.info
